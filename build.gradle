plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'luhub'
}

repositories {
	// REI, Architectury und Cloth Config – nur für den Kompatibilitätstest
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.architectury.dev/' }
	// Mod Menu
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

fabricApi {
	// Automatischer Spieltest (./gradlew runClientGameTest): startet Minecraft, erstellt eine Welt
	// und macht Screenshots von HUD, Inventar, F3 und den Editoren.
	configureTests {
		createSourceSet = true
		modId = "luhub-test"
		eula = true
		enableGameTests = false
		enableClientGameTests = true
	}
}

loom {
	mods {
		"luhub" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// REI wird im automatischen Spieltest mitgeladen, um die Kompatibilität zu prüfen (nicht im Mod enthalten)
	gametestRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") { transitive = false }
	gametestRuntimeOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
	gametestRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { transitive = false }

	// Mod Menu ist optional (Einstellungs-Button in der Mod-Liste)
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
