plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'luhub'
}

repositories {
	// REI, Architectury und Cloth Config – nur für den Kompatibilitätstest
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.architectury.dev/' }
	// Modrinth: Mod Menu und die Original-Mods für den optionalen Kompatibilitätstest
	maven { url = 'https://api.modrinth.com/maven' }
}

fabricApi {
	// Automatischer Spieltest (./gradlew runClientGameTest): startet Minecraft, erstellt eine Welt
	// und macht Screenshots von HUD, Inventar, F3 und den Editoren.
	configureTests {
		createSourceSet = true
		modId = "luhub-test"
		eula = true
		enableGameTests = false
		enableClientGameTests = true
	}
}

loom {
	mods {
		"luhub" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// REI-Plugin (nur geladen, wenn REI installiert ist): REI bleibt beim Verschieben von Fenstern stehen
	compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
	compileOnly("me.shedaniel.cloth:basic-math:0.6.1") { transitive = false }

	// REI wird im automatischen Spieltest mitgeladen, um die Kompatibilität zu prüfen (nicht im Mod enthalten)
	gametestRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") { transitive = false }
	gametestRuntimeOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
	gametestRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { transitive = false }

	// ./gradlew runClientGameTest -PwithOriginalMods: testet, dass Lu Hub neben AppleSkin, Shulker Box Tooltip,
	// Sorted und uku's Armor HUD läuft (Lu Hub schaltet seine eigenen Varianten dann ab)
	if (project.hasProperty('withOriginalMods')) {
		gametestRuntimeOnly("maven.modrinth:appleskin:PHjDtQay") { transitive = false }
		gametestRuntimeOnly("maven.modrinth:shulkerboxtooltip:Cj9VEeGt") { transitive = false }
		gametestRuntimeOnly("maven.modrinth:sorted:yCuh96Ws") { transitive = false }
		gametestRuntimeOnly("maven.modrinth:yacl:3.9.7+26.3-fabric") { transitive = false }
		gametestRuntimeOnly("maven.modrinth:ukus-armor-hud:URl1E7bP") { transitive = false }
		gametestRuntimeOnly("maven.modrinth:ukulib:2.2.0+26.3-fabric") { transitive = false }
	}

	// ./gradlew runClientGameTest -PtutorialTrackerJar=/pfad/tutorial-tracker.jar: zusammen mit Tutorial Tracker testen
	if (project.hasProperty('tutorialTrackerJar')) {
		gametestRuntimeOnly files(project.property('tutorialTrackerJar'))
	}

	// Mod Menu ist optional (Einstellungs-Button in der Mod-Liste)
	compileOnly("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
